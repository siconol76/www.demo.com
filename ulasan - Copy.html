<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Form Preview</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f4f4f4;
      }
      .open-booking {
        padding: 12px 20px;
        background: #b49670;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 18px;
        border-radius: 6px;
      }
      .booking-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        margin-top: 10rem;
      }
      .booking-popup {
        width: 70%;
        max-width: 800px;
        background: #fff;
        border-radius: 6px;
        overflow: hidden;
        position: relative;
        animation: fadeIn 0.3s ease;
      }
      .booking-title {
        background: #b49670;
        color: white;
        padding: 20px;
        margin: 0;
        font-size: 28px;
      }
      .close-booking {
        position: absolute;
        right: 20px;
        top: 18px;
        color: #fff;
        cursor: pointer;
        font-size: 28px;
      }
      .form-row {
        display: flex;
        padding: 12px 20px;
        gap: 20px;
        align-items: center;
      }
      .form-row label {
        width: 260px;
        font-weight: bold;
        color: #333;
      }
      .form-row input,
      .form-row select,
      .form-row textarea {
        flex: 1;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 15px;
      }
      .booking-submit {
        width: 100%;
        padding: 15px;
        margin-top: 10px;
        background: #b49670;
        border: 0;
        color: white;
        font-size: 20px;
        cursor: pointer;
      }
      .booking-submit:hover {
        background: #9c825e;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <button class="open-booking">Booking Sekarang</button>

    <div class="booking-overlay" id="bookingOverlay">
      <div class="booking-popup">
        <span class="close-booking" id="closeBooking">&times;</span>
        <h2 class="booking-title">FORMULIR PEMESANAN</h2>

        <form
          id="bookingForm"
          action="https://formsubmit.co/demo@gmail.com"
          method="POST"
        >
          <div class="form-row">
            <label>Nama Lengkap Anda :</label
            ><input type="text" name="nama" required />
          </div>
          <div class="form-row">
            <label>Alamat Email Anda :</label
            ><input type="email" name="email" required />
          </div>
          <div class="form-row">
            <label>Nomor Telepon Anda :</label
            ><input type="text" name="telepon" required />
          </div>
          <div class="form-row">
            <label>Kebangsaan Anda :</label
            ><input type="text" name="kebangsaan" required />
          </div>
          <div class="form-row">
            <label>Paket Wisata Anda :</label
            ><select name="paket">
              <option>Ubud Tour</option>
              <option>Nusa Penida</option>
            </select>
          </div>
          <div class="form-row">
            <label>Tanggal Tur / Aktivitas :</label
            ><input type="date" name="tanggal" />
          </div>
          <div class="form-row">
            <label>Jumlah Orang :</label><input type="number" name="jumlah" />
          </div>
          <div class="form-row">
            <label>Nama Hotel :</label><input type="text" name="hotel" />
          </div>
          <div class="form-row">
            <label>Detail Pemesanan :</label
            ><textarea name="pesan" rows="3"></textarea>
          </div>

          <button type="submit" class="booking-submit">Kirim Pemesanan</button>
        </form>
      </div>
    </div>

    <script>
      const openBtn = document.querySelector(".open-booking");
      const bookingOverlay = document.getElementById("bookingOverlay");
      const closeBooking = document.getElementById("closeBooking");

      openBtn.onclick = () => (bookingOverlay.style.display = "flex");
      closeBooking.onclick = () => (bookingOverlay.style.display = "none");
      window.onclick = (e) => {
        if (e.target === bookingOverlay) bookingOverlay.style.display = "none";
      };

      // WA + Email

      document
        .getElementById("bookingForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const data = new FormData(this);
          const nama = data.get("nama");
          const email = data.get("email");
          const telepon = data.get("telepon");
          const kebangsaan = data.get("kebangsaan");
          const paket = data.get("paket");
          const tanggal = data.get("tanggal");
          const jumlah = data.get("jumlah");
          const hotel = data.get("hotel");
          const pesan = data.get("pesan");

          const admin1 = "6281234567890";
          const admin2 = "6289876543210";

          const waMessage = `FORM BOOKING ANDIKA BALI TOUR\n\nNama: ${nama}\nEmail: ${email}\nTelepon: ${telepon}\nKebangsaan: ${kebangsaan}\nPaket: ${paket}\nTanggal: ${tanggal}\nJumlah Orang: ${jumlah}\nHotel: ${hotel}\n\nPesan Tambahan:\n${pesan}`;

          window.open(
            `https://wa.me/${admin1}?text=${encodeURIComponent(waMessage)}`,
            "_blank"
          );

          setTimeout(() => {
            window.open(
              `https://wa.me/${admin2}?text=${encodeURIComponent(waMessage)}`,
              "_blank"
            );
          }, 1000);

          this.submit();
        });
    </script>
  </body>
</html>
